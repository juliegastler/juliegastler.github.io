<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>U1 L4 Grading Buttons</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#17212b;background:#f3f5f8}body{max-width:820px;margin:22px auto;padding:0 16px 35px}h1{font-size:1.5rem;margin-bottom:4px}.sub{color:#52606d;margin-top:0}.score{position:sticky;top:0;background:#fff;border:2px solid #b7c4d1;border-radius:12px;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2;box-shadow:0 2px 8px #0001}.score strong{font-size:2rem;font-variant-numeric:tabular-nums}.score small{display:block;color:#52606d}section{background:white;border-radius:12px;margin-top:14px;padding:12px 16px;box-shadow:0 1px 5px #0001}h2{font-size:1.05rem;margin:0 0 8px;color:#253e55}.criterion{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid #e7edf2}.criterion label{line-height:1.35;flex:1}.toggle{width:78px;min-width:78px;height:48px;border-radius:9px;border:2px solid #aeb7c2;background:#e5e7eb;color:#17212b;font-weight:bold;font-size:1.25rem;cursor:pointer}.toggle[data-score="0.5"]{background:#ffe17a;border-color:#b68a00}.toggle[data-score="1"]{background:#92e3a9;border-color:#218345}.toggle:focus-visible{outline:3px solid #3869cb;outline-offset:2px}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}#reset{padding:12px 20px;background:#253e55;color:white;border:0;border-radius:8px;font-size:1rem;cursor:pointer}.note{font-size:.84rem;color:#56616d} @media(max-width:500px){.score strong{font-size:1.55rem}.criterion label{font-size:.93rem}}
</style></head><body><h1>Freshman Physics · Unit 1 Lesson 4</h1><p class="sub">Energy Bar Charts · Grading Buttons</p><div class="score" aria-live="polite"><div><small>Rubric points</small><strong id="points">0 / 9</strong></div><div><small>Quiz score (out of 12)</small><strong id="grade">0 / 12</strong></div></div><main id="rubric"></main><div class="bottom"><button id="reset">Reset All</button><span class="note">Click each button: 0 → 0.5 → 1 → 0</span></div><script>
const groups=[['System',['Objects written in circle']],['Initial State',['Correct energy',"No extra energies unless it’s thermal and it makes sense"]],['Final State',['Correct energy number 1','Correct energy number 2',"No extra energies unless it’s thermal and it didn’t change or changed appropriately"]],['Amounts in Bars',['Initial total = Final total']],['Energy Equation',['Matches graphs','Shows energy conservation']]];
const scale=[0,1,3,4,5,7,8,9,11,12];let buttons=[];const root=document.getElementById('rubric');for(const [name,items] of groups){let section=document.createElement('section'),h=document.createElement('h2');h.textContent=`${name} (${items.length} point${items.length===1?'':'s'})`;section.append(h);for(const item of items){const row=document.createElement('div');row.className='criterion';const label=document.createElement('label');label.textContent=item;const btn=document.createElement('button');btn.className='toggle';btn.textContent='0';btn.dataset.score='0';btn.setAttribute('aria-label',`${item}: 0 points`);btn.onclick=()=>{let next=({'0':'0.5','0.5':'1','1':'0'})[btn.dataset.score];btn.dataset.score=next;btn.textContent=next;btn.setAttribute('aria-label',`${item}: ${next} points`);update()};row.append(label,btn);section.append(row);buttons.push(btn)}root.append(section)}function update(){let total=buttons.reduce((s,b)=>s+Number(b.dataset.score),0);document.getElementById('points').textContent=`${total} / 9`;let lo=Math.floor(total),hi=Math.ceil(total);let converted=lo===hi?scale[lo]:scale[lo]+(scale[hi]-scale[lo])*(total-lo)/(hi-lo);document.getElementById('grade').textContent=`${Number(converted.toFixed(2))} / 12`};document.getElementById('reset').onclick=()=>{for(const b of buttons){b.dataset.score='0';b.textContent='0';b.setAttribute('aria-label',b.getAttribute('aria-label').replace(/: .* points$/,': 0 points'))}update()};
</script></body></html>
